# Every merge (push) to main builds a signed APK and publishes it as a GitHub release.
# The app (Updater.java) checks the latest release, and installs a higher versionCode.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Version and signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
          cp app/build/outputs/apk/release/app-release.apk "TheAnswer-1.$VERSION_CODE.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B | grep -v '^Co-Authored-By:' | sed -e :a -e '/^
*$/{$d;N;ba' -e '}' > notes.txt  # the commit message, no trailers
          gh release create "v$VERSION_CODE" "TheAnswer-1.$VERSION_CODE.apk" \
            --title "גרסה 1.$VERSION_CODE" --notes-file notes.txt --latest

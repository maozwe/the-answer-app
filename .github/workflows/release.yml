# Every merge (push) to main builds the Android app and the Windows app and publishes each on its
# own release line in manage-control (platform android / windows). The apps update themselves from
# https://api.weisscivitech.com/api/v1/storefront/apps/<slug>/latest?platform=..., checking sha256.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: release

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      MANAGE_CONTROL_API_KEY: ${{ secrets.MANAGE_CONTROL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Draft a version
        run: scripts/mc.sh draft android

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION_NAME="$MC_VERSION" ./gradlew assembleRelease --no-daemon --console=plain
          cp app/build/outputs/apk/release/app-release.apk "TheAnswer-$MC_VERSION.apk"

      - name: Publish
        run: scripts/mc.sh ship "TheAnswer-$MC_VERSION.apk"

      - name: Discard the draft
        if: failure()
        run: scripts/mc.sh discard

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      MANAGE_CONTROL_API_KEY: ${{ secrets.MANAGE_CONTROL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Draft a version
        run: scripts/mc.sh draft windows

      - name: Build TheAnswer.exe
        run: |
          dotnet publish windows/TheAnswer.csproj -c Release -p:Version="$MC_VERSION" -o out
          cp out/TheAnswer.exe "TheAnswer-$MC_VERSION.exe"

      - name: Publish
        run: scripts/mc.sh ship "TheAnswer-$MC_VERSION.exe"

      - name: Discard the draft
        if: failure()
        run: scripts/mc.sh discard
